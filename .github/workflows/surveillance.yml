name: Surveillance billetterie Turkiye-Fransa

on:
  schedule:
    # Toutes les 5 minutes (UTC). GitHub peut decaler de quelques minutes en cas de charge.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_discord:
        description: "Envoyer un message de TEST sur Discord (pour verifier l'alarme)"
        type: boolean
        default: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier la billetterie
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python check.py ${{ inputs.test_discord && '--ping' || '' }}
