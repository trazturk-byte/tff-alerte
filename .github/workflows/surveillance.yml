name: Surveillance billetterie Turkiye-Fransa

on:
  schedule:
    # GitHub BRIDE fortement les crons frequents : en pratique un run demarre
    # toutes les 2 a 6 heures, pas toutes les 5 minutes. On demande quand meme
    # toutes les 10 min pour maximiser les chances qu'un run soit relance vite,
    # et surtout chaque run tourne pres de 6 h (voir timeout ci-dessous) pour
    # que la couverture reste continue malgre le bridage.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Que faire ?"
        type: choice
        default: normal
        options:
          - normal      # surveillance reelle
          - ping        # test de connexion des canaux (2 min)
          - simuler     # REPETITION GENERALE : comme si la billetterie venait d'ouvrir

# Un nouveau run remplace celui en cours : on repart sur du frais plutot que
# d'empiler des jobs de 6 h qui se marcheraient dessus.
concurrency:
  group: surveillance
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    # 6 h = plafond d'un job sur un runner GitHub. Le script s'arrete de lui-meme
    # a 5 h 40 (DUREE_RUN), donc le timeout ne sert que de filet.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Surveillance
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
        run: |
          case "${{ inputs.mode }}" in
            ping)    python check.py --ping ;;
            simuler) python check.py --watch --simuler ;;
            *)       python check.py --watch ;;
          esac
