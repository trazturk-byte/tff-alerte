name: Surveillance billetterie Turkiye-Fransa

on:
  schedule:
    # Un run toutes les 5 minutes. Chaque run BOUCLE en interne pendant 4 min 30
    # en verifiant toutes les 30 secondes -> couverture quasi ininterrompue.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Que faire ?"
        type: choice
        default: normal
        options:
          - normal      # surveillance reelle
          - ping        # simple test de connexion des canaux
          - simuler     # REPETITION GENERALE : comme si la billetterie venait d'ouvrir

# Evite l'empilement si un run deborde sur le suivant.
concurrency:
  group: surveillance
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Surveillance
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
        run: |
          case "${{ inputs.mode }}" in
            ping)    python check.py --ping ;;
            simuler) python check.py --watch --simuler ;;
            *)       python check.py --watch ;;
          esac
