name: Surveillance billetterie Turkiye-Fransa

on:
  schedule:
    # Un run toutes les 5 minutes. Chaque run BOUCLE en interne pendant 4 min 30
    # en verifiant toutes les 30 secondes -> couverture quasi ininterrompue.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_discord:
        description: "Envoyer un message de TEST sur Discord"
        type: boolean
        default: false

# Evite l'empilement si un run deborde sur le suivant.
concurrency:
  group: surveillance
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Surveillance continue
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ "${{ inputs.test_discord }}" = "true" ]; then
            python check.py --ping
          else
            python check.py --watch
          fi
